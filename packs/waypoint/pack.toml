# Waypoint - graphite surfaces, machined-amber accent. The Linux Workbench.
# The approved palette is frozen: change it only with Kahlil's say-so.

[theme]
id = "waypoint"
name = "Waypoint"
command = "waypoint"
brand = "The Linux Workbench"
version = "0.1.0"                     # first release on the engine (was Waypoint KDE 0.5.0)
license = "GPL-3.0-or-later"
editions = ["dark", "light"]
lookandfeel_id = "org.thelinuxworkbench.waypoint"
previous_ids = ["org.waypoint"]       # the installer moves people off these
parts = ["kde-colors", "konsole", "plasma-style", "aurorae", "cursors", "kvantum"]

[theme.names]
# as released; installed systems refer to these, so they stay
color_scheme = "{Slug}-{Edition}"      # Waypoint-Dark
konsole = "{Compact}{Edition}"         # WaypointDark
plasma_style = "{id}-{edition}"        # waypoint-dark
kvantum = "{Compact}{Edition}"         # WaypointDark

[colours]
graphite_black = "#0F1217"
graphite = "#1C222A"
graphite_raised = "#272E37"
steel_line = "#3A434F"
frost = "#E6EDF3"
steel = "#9AA6B2"
steel_dim = "#5C6672"
amber = "#D69A50"
amber_bright = "#FFB357"
light_grey = "#E6E6E6"
light_surface = "#D1D3D6"
light_control = "#C8CBD0"
light_line = "#B8BEC6"
ink = "#2B2F36"
slate = "#667085"
amber_ink = "#7C511D"           # amber is too light for text on light grey
red = "#BE2D2D"
orange = "#AA6900"
green = "#237D4B"

# ----------------------------------------------------------------------------- Dark
[edition.dark]
name = "Dark"

[edition.dark.text]
plasma = "Waypoint dark Plasma theme with restrained amber highlights."
decoration = "Machined graphite window decoration (dark)."
kvantum_author = "{Brand} (derived from Kvantum KvArc by Pedram Pourang, GPL-3.0)"
kvantum_comment = "{Name} {Edition}: graphite/amber, translucent windows and menus"

[edition.dark.roles]
base_bg = "graphite_black"      # terminal background, inactive title bar
window_bg = "graphite"
view_bg = "graphite"
view_alt_bg = "graphite_raised"
tooltip_bg = "graphite"
border = "steel_line"
text = "frost"
text_muted = "steel"
text_disabled = "steel_dim"
accent = "amber"
selection_bg = "amber"
selection_fg = "graphite_black"
selection_alt_bg = "amber_bright"
hover_decoration = "steel"
negative = "red"
neutral = "orange"
positive = "green"

# Where Waypoint's colour scheme differs from the engine's default mapping
[edition.dark.kde]
effects_colour = "#706F6E"
change_selection_colour = false
widget_style = "Breeze"

[edition.dark.kde.Selection]
DecorationFocus = "accent"
DecorationHover = "hover_decoration"
ForegroundInactive = "#FFFFFF"
ForegroundActive = "#FFFFFF"
ForegroundLink = "selection_fg"
ForegroundVisited = "selection_fg"

[edition.dark.kde.Tooltip]
BackgroundAlternate = "tooltip_bg"
DecorationFocus = ""
DecorationHover = ""

[edition.dark.kde.Header]
BackgroundAlternate = "view_alt_bg"

[edition.dark.kde."Header][Inactive"]
BackgroundAlternate = "view_alt_bg"
ForegroundNormal = "text"

[edition.dark.kde.WM]
activeBlend = "window_bg"
inactiveBackground = "base_bg"
inactiveBlend = "base_bg"

[edition.dark.terminal]
opacity = 0.88
blur = true
#          black              red        green      yellow     blue       magenta    cyan       white
normal = ["graphite_raised", "#D0686B", "#8DB277", "amber",   "#7A9CC6", "#B08BBB", "#6DADAD", "steel"]
bright = ["#4A5562",         "#E58A8C", "#A9CB94", "#E8B572", "#9DB8DB", "#C9A9D2", "#8EC6C6", "frost"]

# ----------------------------------------------------------------------------- Light
[edition.light]
name = "Light"

[edition.light.text]
plasma = "Waypoint light Plasma theme with restrained amber highlights."
decoration = "Machined graphite window decoration (light)."
kvantum_author = "{Brand} (derived from Kvantum KvArc by Pedram Pourang, GPL-3.0)"
kvantum_comment = "{Name} {Edition}: graphite/amber, translucent windows and menus"

[edition.light.roles]
window_bg = "light_grey"
view_bg = "light_grey"
view_alt_bg = "light_surface"
button_bg = "light_control"
button_alt_bg = "light_surface"
border = "light_line"
text = "ink"
text_muted = "slate"
text_disabled = "steel"
accent = "amber"
selection_bg = "amber"
selection_fg = "graphite_black"
selection_alt_bg = "amber_bright"
hover_decoration = "slate"
link = "amber_ink"
negative = "red"
neutral = "orange"
positive = "green"

[edition.light.kde]
effects_colour = "#706F6E"
change_selection_colour = false
widget_style = "Breeze"
# panels and OSDs keep Waypoint Dark's surfaces (complementary = "dark", the default)

[edition.light.kde.Selection]
DecorationFocus = "accent"
DecorationHover = "hover_decoration"
ForegroundInactive = "#FFFFFF"
ForegroundActive = "#FFFFFF"
ForegroundLink = "selection_fg"
ForegroundVisited = "selection_fg"

[edition.light.kde.Tooltip]
DecorationFocus = ""
DecorationHover = ""

[edition.light.kde.Header]
BackgroundAlternate = "view_alt_bg"

[edition.light.kde."Header][Inactive"]
BackgroundAlternate = "view_alt_bg"
ForegroundNormal = "text"

[edition.light.kde.WM]
activeBackground = "view_alt_bg"
activeBlend = "view_alt_bg"
inactiveBlend = "window_bg"

[edition.light.terminal]
background_intense = "view_alt_bg"
foreground_intense = "dark.base_bg"
opacity = 0.92
blur = true
normal = ["ink",     "#A63A3E", "#456B31", "#875818", "#3A5F95", "#7A4C88", "#2C6E6E", "slate"]
bright = ["#4A5260", "#8E2E32", "#3D612B", "#704812", "#2E4E7D", "#663E73", "#225B5B", "light_line"]

# ----------------------------------------------------------------------------- Kvantum
# Waypoint's build_kvantum.py as rules: Arc neutrals by luminance onto the graphite scale, Arc blues
# to the amber family (keeping each shade's offset from Arc's #5294E2), Arc reds to the negative red.
[edition.dark.kvantum]
neutral = "luminance"
anchors = [["#000000", "#000000"], ["#111217", "#08090C"], ["#22252E", "#0F1217"], ["#2F343F", "#161B22"],
           ["#383C4A", "#1C222A"], ["#404552", "#272E37"], ["#4D5367", "#313945"], ["#5A616E", "#3A434F"],
           ["#92959D", "#9AA6B2"], ["#D3DAE3", "#E6EDF3"], ["#FFFFFF", "#FFFFFF"]]
lightness = [0.12, 0.92]
hues = [{from = 185, to = 300, kind = "accent", family = "accent", reference = "#5294E2"},
        {from = 340, to = 20, family = "red", reference = "#F04A50"}]
short_hex = true
on_accent = "selection_fg"
focus = "#566170"
disabled_buttons = 0.45
text = "text"

[edition.dark.kvantum.general]
"window.color" = "graphite"
"base.color" = "graphite_raised"
"alt.base.color" = "graphite"
"button.color" = "graphite_raised"
"light.color" = "steel_line"
"mid.light.color" = "graphite_raised"
"dark.color" = "#000000"
"mid.color" = "graphite_black"
"highlight.color" = "accent"
"inactive.highlight.color" = "accent"
"text.color" = "text"
"window.text.color" = "text"
"button.text.color" = "text"
"disabled.text.color" = "steel_dim"
"tooltip.text.color" = "text"
"highlight.text.color" = "selection_fg"
"link.color" = "accent"
"link.visited.color" = "text_muted"
"progress.indicator.text.color" = "selection_fg"

[edition.dark.kvantum.settings]
translucent_windows = true
blurring = true
popup_blurring = true
reduce_window_opacity = 30          # windows and menus 30 % see-through; the blur keeps text readable
reduce_menu_opacity = 30
no_inactiveness = true              # unfocused windows look the same; KWin dims them instead
splitter_width = 1                  # KvArc's 4 px cut Dolphin's floating status bar text short
menu_blur_radius = 6
tooltip_blur_radius = 6
opaque = "kaffeine,kmplayer,subtitlecomposer,kdenlive,vlc,avidemux,avidemux2_qt4,avidemux3_qt4,avidemux3_qt5,kamoso,QtCreator,VirtualBox,VirtualBoxVM,trojita,dragon,digikam,lyx,krita,obs,libreoffice,soffice.bin,blender,freecad,qgis"

[edition.dark.kvantum.hacks]
blur_translucent = true
transparent_dolphin_view = true
respect_darkness = true

[edition.light.kvantum]
neutral = "luminance"
anchors = [["#000000", "#000000"], ["#323232", "#2B2F36"], ["#7B7B7B", "#667085"], ["#A5AFC3", "#8E97A3"],
           ["#CFD6E6", "#B8BEC6"], ["#E1E4EB", "#C4C8CD"], ["#F5F6F7", "#D1D3D6"], ["#FFFFFF", "#E6E6E6"]]
lightness = [0.12, 0.92]
hues = [{from = 185, to = 300, kind = "accent", family = "accent", reference = "#5294E2"},
        {from = 340, to = 20, family = "red", reference = "#F04A50"}]
short_hex = true
on_accent = "selection_fg"
focus = "#8E97A3"
disabled_buttons = 0.45
text = "text"

[edition.light.kvantum.general]
"window.color" = "light_surface"
"base.color" = "light_grey"
"alt.base.color" = "light_surface"
"button.color" = "light_grey"
"light.color" = "#FFFFFF"
"mid.light.color" = "light_grey"
"dark.color" = "#8E97A3"
"mid.color" = "light_line"
"highlight.color" = "accent"
"inactive.highlight.color" = "accent"
"text.color" = "text"
"window.text.color" = "text"
"button.text.color" = "text"
"disabled.text.color" = "#9CA3AD"
"tooltip.text.color" = "text"
"highlight.text.color" = "selection_fg"
"link.color" = "link"
"link.visited.color" = "text_muted"
"progress.indicator.text.color" = "selection_fg"

[edition.light.kvantum.settings]
translucent_windows = true
blurring = true
popup_blurring = true
reduce_window_opacity = 30          # windows and menus 30 % see-through; the blur keeps text readable
reduce_menu_opacity = 30
no_inactiveness = true              # unfocused windows look the same; KWin dims them instead
splitter_width = 1                  # KvArc's 4 px cut Dolphin's floating status bar text short
menu_blur_radius = 6
tooltip_blur_radius = 6
opaque = "kaffeine,kmplayer,subtitlecomposer,kdenlive,vlc,avidemux,avidemux2_qt4,avidemux3_qt4,avidemux3_qt5,kamoso,QtCreator,VirtualBox,VirtualBoxVM,trojita,dragon,digikam,lyx,krita,obs,libreoffice,soffice.bin,blender,freecad,qgis"

[edition.light.kvantum.hacks]
blur_translucent = true
transparent_dolphin_view = true
respect_darkness = true
