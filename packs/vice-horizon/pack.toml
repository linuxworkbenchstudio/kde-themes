notification = "coral_red"
tooltip_bg = "midnight_raised"
tooltip_fg = "soft_white"
complementary_bg = "midnight"
complementary_fg = "soft_white"
osd_bg = "midnight_abyss"

[edition.dark.kde.Selection]          # Vice Horizon's text colours on a selection
ForegroundInactive = "#EAD0D8"
