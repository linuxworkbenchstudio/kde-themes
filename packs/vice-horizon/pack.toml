# Vice Horizon - Miami-sunset palette: Midnight Violet (Dark) and Shell Blush (Light).
# The Linux Workbench. Converted from Vice Horizon 1.8.2's config/tokens.json by
# tools/convert_vice_horizon.py; edit this file from now on.

[theme]
id = "vice-horizon"
name = "Vice Horizon"
command = "vice-horizon"
brand = "The Linux Workbench"
version = "0.1.0"                     # first release on the engine (was 1.8.2)
license = "GPL-3.0-or-later"
editions = ["dark", "light"]
lookandfeel_id = "org.thelinuxworkbench.vicehorizon"
previous_ids = ["org.digitalcohesion.vicehorizon"]
parts = ["kde-colors", "konsole", "plasma-style", "aurorae", "cursors", "kvantum", "fastfetch", "gtk", "icons", "brand", "panel-looks", "panel-layout", "widgets", "lookandfeel", "programs"]

[theme.gtk.replace]
# GTK 4 paints suggested-action with the selection colour; Vice Horizon keeps coral for primary actions
"gtk-4.0/_common.scss" = [["(suggested-action, $selected_bg_color)", "(suggested-action, $suggested_bg_color)"]]

[theme.icons]
comment = "{Name} sunset folders, app, device and file-type icons (glyphs partly from KDE Breeze, LGPL-3.0-or-later); everything else inherits from Papirus, Breeze or Adwaita"

[theme.programs]
tagline = "A sunset theme for KDE Plasma 6, in Dark and Light."
dark_surface = "Midnight Violet"
light_surface = "Soft White"
dark_hint = "Midnight Violet surfaces, sunset accents."
light_hint = "Soft White surfaces with a see-through white top bar."
bar = ["peach_glow", "horizon_pink", "sunset_mauve", "palm_violet"]   # Peach Glow -> Horizon Pink -> Sunset Mauve -> Palm Violet

[theme.fastfetch]
# the Fastfetch tool's colours for your own config (accent and muted text, per edition)
accent_dark = "horizon_pink"
muted_dark = "violet_haze"
accent_light = "rose_ink"
muted_light = "plum_muted"
# the launcher tile's sunset gradient, peach (top right) to violet (bottom left)
logo_colours = ["#FCB377", "#FC8376", "#FA5C93", "#E249BE", "#9A47E1", "#7449E9"]

[colours]
sunset_mauve = "#C48FBA"    # Sunset Mauve
horizon_pink = "#EFA1A1"    # Horizon Pink
peach_glow = "#F9C8B2"    # Peach Glow
palm_violet = "#857DB5"    # Palm Violet
coral_red = "#EA5148"    # Coral Red
deep_plum = "#2F1F2B"    # Deep Plum
rose_shadow = "#A77091"    # Rose Shadow
soft_white = "#FEFCFC"    # Soft White
plum_abyss = "#271A24"
