# ----------------------------------------------------------------------------- Kvantum
# Vice Horizon's kvantum.py as rules: Arc neutrals onto a tinted lightness ramp, Arc blues to the
# accent family in lightness steps, the other hues to fixed palette colours.
[edition.dark.kvantum]
ramp = [[0.00, "#000000"], [0.08, "#0B0A16"], [0.16, "#121022"], [0.22, "#17152A"], [0.25, "#1D1A2E"],
        [0.29, "#252239"], [0.32, "#2B2843"], [0.36, "#363052"], [0.44, "#4B4670"], [0.50, "#5E5888"],
        [0.59, "#8D87B3"], [0.71, "#AEA8D2"], [0.84, "#CEC9EA"], [1.00, "#FEFCFC"]]
hues = [{from = 180, to = 235, kind = "accent", steps = [[0.40, "#8A3A57"], [0.50, "#9C4262"], [0.62, "rose_deep"], [0.80, "horizon_pink"], [9, "#F6D6D6"]]},
        {from = 235, to = 300, colour = "sunset_mauve"},
        {from = 340, to = 20, colour = "coral_red"},
        {from = 20, to = 70, colour = "peach_glow"},
        {from = 0, to = 360, colour = "palm_mint"}]
alpha_hex = true
text = "opaque"

[edition.dark.kvantum.special]
"#5294e2" = "selection_bg"
"#eefcff" = "tooltip_fg"
"#009dff" = "link"
"#0057ae" = "link"
"#9e4fff" = "visited"
"#452886" = "visited"
"#f04a50" = "coral_red"

[edition.dark.kvantum.general]
"window.color" = "window_bg"
"base.color" = "view_bg"
"alt.base.color" = "view_alt_bg"
"button.color" = "button_bg"
"light.color" = "#3B3657"
